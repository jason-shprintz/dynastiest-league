<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>The Dynastiest League | Dynasty Fantasy Football Since 2020</title>
    <meta
      name="title"
      content="The Dynastiest League | Dynasty Fantasy Football Since 2020"
    />
    <meta
      name="description"
      content="The Dynastiest League is a 10-team dynasty fantasy football league established in 2020. View our Hall of Records, current champion jeffgottfried (2025), league constitution, and $1,000 annual prize pool."
    />
    <meta
      name="keywords"
      content="dynasty fantasy football, fantasy football league, Dynastiest League, dynasty league, FFB, fantasy football 2025, Sleeper fantasy football, dynasty fantasy, keeper league"
    />
    <meta name="author" content="The Dynastiest League" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="rating" content="general" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dynastiestleague.com/" />
    <meta
      property="og:title"
      content="The Dynastiest League | Dynasty Fantasy Football Since 2020"
    />
    <meta
      property="og:description"
      content="The Dynastiest League is a 10-team dynasty fantasy football league established in 2020. View our Hall of Records, current champion, league constitution, and $1,000 annual prize pool."
    />
    <meta
      property="og:image"
      content="https://dynastiestleague.com/Logo.webp"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dynastiest League Logo" />
    <meta property="og:site_name" content="The Dynastiest League" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dynastiestleague.com/" />
    <meta
      name="twitter:title"
      content="The Dynastiest League | Dynasty Fantasy Football Since 2020"
    />
    <meta
      name="twitter:description"
      content="The Dynastiest League is a 10-team dynasty fantasy football league established in 2020. View our Hall of Records, current champion jeffgottfried (2025), league constitution, and $1,000 annual prize pool."
    />
    <meta
      name="twitter:image"
      content="https://dynastiestleague.com/Logo.webp"
    />
    <meta name="twitter:image:alt" content="The Dynastiest League Logo" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/Logo.png" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="msapplication-TileColor" content="#1a1a2e" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://dynastiestleague.com/" />

    <!-- Warm up the Sleeper API connection; league data is fetched during
         module evaluation, before React has mounted. -->
    <link
      rel="preconnect"
      href="https://api.sleeper.app"
      crossorigin="anonymous"
    />
    <link rel="dns-prefetch" href="https://api.sleeper.app" />

    <!-- Preload critical fonts (Latin subsets generated by scripts/subset-fonts.mjs).
         Anton renders the above-the-fold <h1>, so it keeps high priority. Inter
         loads at default priority so it does not compete with the LCP image. -->
    <link
      rel="preload"
      href="/fonts/Anton-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/fonts/Inter-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!--
      Analytics is loaded by Cloudflare Zaraz at the edge, not from this file.
      Zaraz injects the GA4 tag into the response as it passes through the
      proxy, so there is no snippet to maintain here and no measurement ID in
      the bundle. Configured in the Cloudflare dashboard under Account → Tag
      Management → Zaraz, for the dynastiestleague.com zone.

      Zaraz covers the initial document load on its own. Because this is a
      client-rendered SPA, hash navigation is reported separately from
      src/hooks/usePageMeta.ts — see src/helper/analytics.ts. Zaraz's built-in
      "Single Page Application support" setting is intentionally disabled; it
      fires before the document title is updated and would mislabel every view.

      Zaraz only runs on the proxied apex domain, so nothing is reported from
      local dev or from *.pages.dev preview deployments.
    -->

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsOrganization",
        "name": "The Dynastiest League",
        "description": "A 10-team dynasty fantasy football league established in 2020 with a $1,000 annual prize pool.",
        "url": "https://dynastiestleague.com/",
        "logo": "https://dynastiestleague.com/Logo.webp",
        "foundingDate": "2020",
        "sport": "Fantasy Football",
        "numberOfEmployees": { "@type": "QuantitativeValue", "value": 10 },
        "award": "jeffgottfried — 2025 Champion"
      }
    </script>
  </head>
  <body>
    <noscript>
      <p>
        The Dynastiest League — Dynasty Fantasy Football Since 2020. Please
        enable JavaScript to view this site.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
