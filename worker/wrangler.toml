name = "dynastiest-league-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "dynastiest-league-db"
database_id = "d93d3be4-7f27-48f6-b8e6-5037abacac42"

# KV namespace for caching Sleeper player data (refreshed daily)
[[kv_namespaces]]
binding = "PLAYERS_KV"
id = "7a76420693ce4dcfb81667ea1727fd25"

# Cron trigger - runs every 1 minute for draft-week responsiveness
[triggers]
crons = ["*/1 * * * *"]

# Environment variables (secrets should be set via wrangler secret put)
[vars]
SLEEPER_LEAGUE_ID = "1326434695138787328"
TRADE_ANALYSIS_VERSION = "v2"
DRAFT_ANALYSIS_VERSION = "v1"
# Set LEAGUE_DRAFT_ID to the active draft's ID to enable draft analysis
# LEAGUE_DRAFT_ID = ""
